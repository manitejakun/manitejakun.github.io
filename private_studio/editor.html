<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self'; form-action 'none'; base-uri 'none'; font-src 'self'"><title>Journal studio | Mani Teja</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/studio/studio.css"><script defer src="/editor.js"></script></head>
